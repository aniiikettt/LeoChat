<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Systems Lab: Stateful Chatbot Engine</title>
    <!-- Google Fonts for modern typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Plus+Jakarta+Sans:wght@300;400;600;700&family=Space+Grotesk:wght@500;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-primary: #0a0a14;
            --bg-secondary: rgba(20, 20, 35, 0.65);
            --bg-tertiary: rgba(30, 30, 50, 0.8);
            --accent-primary: #7c4dff;
            --accent-secondary: #00e5ff;
            --text-primary: #f5f5fa;
            --text-secondary: #9fa0b7;
            --border-color: rgba(255, 255, 255, 0.08);
            --glass-blur: blur(16px);
            --font-main: 'Plus Jakarta Sans', sans-serif;
            --font-heading: 'Outfit', sans-serif;
            --font-mono: 'Fira Code', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at 50% 50%, #141029 0%, #05050a 100%);
            color: var(--text-primary);
            font-family: var(--font-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: stretch;
            padding: 20px;
            overflow: auto;
        }

        /* Full page grid dashboard */
        .dashboard {
            width: calc(100vw - 40px);
            height: calc(100vh - 40px);
            max-width: 1400px;
            background: var(--bg-secondary);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            display: grid;
            grid-template-columns: 360px 1fr;
            grid-template-rows: 100%;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        /* Sidebar styling */
        .sidebar {
            background: rgba(10, 10, 20, 0.8);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 24px;
            gap: 24px;
            overflow-y: auto;
            min-height: 0;
            min-width: 0;
            width: 350px;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                        padding 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                        opacity 0.2s ease,
                        border-right-width 0.3s ease;
        }

        .sidebar.collapsed {
            width: 0;
            min-width: 0;
            padding-left: 0;
            padding-right: 0;
            opacity: 0;
            pointer-events: none;
            border-right-width: 0;
            overflow: hidden;
            gap: 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: var(--font-heading);
        }

        .brand-logo {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 800;
            font-size: 18px;
            color: #fff;
            box-shadow: 0 0 15px rgba(124, 77, 255, 0.4);
        }

        .brand-title {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #ffffff, #c9c9f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .section-title {
            font-family: var(--font-heading);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .control-panel, .analytics-panel {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .text-field {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 12px;
            color: var(--text-primary);
            font-family: var(--font-main);
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }

        .text-field:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 8px rgba(124, 77, 255, 0.2);
        }

        textarea.text-field {
            resize: none;
            height: 100px;
            font-size: 13px;
        }

        .btn {
            background: linear-gradient(135deg, var(--accent-primary) 0%, #6200ea 100%);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            opacity: 0.95;
            box-shadow: 0 4px 15px rgba(124, 77, 255, 0.4);
            transform: translateY(-1px);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--accent-primary);
            color: var(--accent-primary);
        }

        .btn-outline:hover {
            background: rgba(124, 77, 255, 0.05);
            box-shadow: none;
        }

        .metric-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            padding-bottom: 8px;
        }

        .metric-row:last-child {
            border: none;
            padding: 0;
        }

        .metric-value {
            font-family: var(--font-mono);
            font-weight: 600;
            color: var(--accent-secondary);
        }

        /* Chat view styling */
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: rgba(5, 5, 10, 0.3);
            position: relative;
            min-height: 0;
        }

        .chat-header {
            padding: 20px 32px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 10, 20, 0.4);
        }

        .toggle-sidebar-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .toggle-sidebar-btn:hover {
            color: var(--accent-secondary);
            background: rgba(255, 255, 255, 0.05);
        }
        .sidebar.collapsed {
            display: none;
        }

        .header-info h2 {
            font-family: var(--font-heading);
            font-size: 18px;
            font-weight: 700;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #4caf50;
            font-weight: 600;
            background: rgba(76, 175, 80, 0.1);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(76, 175, 80, 0.2);
        }

        .chat-feed {
            flex: 1;
            overflow-y: auto;
            padding: 24px 28px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-width: 0;
        }

        .message-bubble {
            max-width: 65%;
            display: flex;
            flex-direction: column;
            gap: 6px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-bubble.user {
            align-self: flex-end;
        }

        .message-bubble.assistant {
            align-self: flex-start;
        }

        .message-sender {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
        }

        .user .message-sender {
            align-self: flex-end;
            color: var(--accent-secondary);
        }

        .message-content {
            padding: 14px 18px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .user .message-content {
            background: linear-gradient(135deg, var(--accent-primary) 0%, #512da8 100%);
            color: white;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(124, 77, 255, 0.25);
        }

        .assistant .message-content {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .chat-input-area {
            padding: 24px 32px;
            background: rgba(10, 10, 20, 0.6);
            border-top: 1px solid var(--border-color);
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 8px 12px;
            align-items: center;
            transition: all 0.3s;
        }

        .input-wrapper:focus-within {
            border-color: var(--accent-primary);
            box-shadow: 0 0 10px rgba(124, 77, 255, 0.15);
        }

        .chat-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-family: var(--font-main);
            font-size: 15px;
            padding: 8px 4px;
        }

        .typing-indicator {
            align-self: flex-start;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            padding: 12px 18px;
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            display: none;
            align-items: center;
            gap: 5px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: bounce 1.3s infinite ease-in-out;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.15s; }
        .typing-dot:nth-child(3) { animation-delay: 0.3s; }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }

        /* Telemetry overlay inside chat */
        .telemetry-chip {
            background: rgba(0, 229, 255, 0.05);
            border: 1px solid rgba(0, 229, 255, 0.15);
            color: var(--accent-secondary);
            font-family: var(--font-mono);
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            margin-top: 4px;
            align-self: flex-start;
        }
        
        .user .telemetry-chip {
            align-self: flex-end;
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-logo">Δ</div>
                <div class="brand-title">AI Systems Lab</div>
            </div>

            <hr style="border: none; border-top: 1px solid var(--border-color);">
            <!-- Configuration -->
            <div>
                <h3 class="section-title">Runtime Configuration</h3>
                <div class="control-panel">
                    <div class="input-group">
                        <label class="input-label" for="session-id-input">Session Key (ID)</label>
                        <input type="text" id="session-id-input" class="text-field" placeholder="Auto-generated" readonly>
                    </div>
                    
                    <div class="input-group">
                        <label class="input-label" for="system-prompt-input">System Instructions</label>
                        <textarea id="system-prompt-input" class="text-field" placeholder="Customize model behavior..."></textarea>
                    </div>

                    <button class="btn btn-outline" id="btn-reset-session">
                        Reset Session State
                    </button>
                </div>
            </div>

            <!-- Knowledge Base (RAG) -->
            <div>
                <h3 class="section-title">Knowledge Base (RAG)</h3>
                <div class="control-panel">
                    <div class="input-group">
                        <label class="input-label" for="knowledge-input">Document Context</label>
                        <textarea id="knowledge-input" class="text-field" placeholder="Paste manuals, text logs, or FAQs here to enable RAG context retrieval..." style="height: 120px;"></textarea>
                    </div>
                    <button class="btn btn-outline" id="btn-save-knowledge" style="border-color: var(--accent-secondary); color: var(--accent-secondary);">
                        Apply Knowledge Context
                    </button>
                </div>
            </div>

            <!-- Cost & Metrics -->
            <div>
                <h3 class="section-title">Telemetry & Cost Tracking</h3>
                <div class="analytics-panel">
                    <div class="metric-row">
                        <span>Current Latency</span>
                        <span class="metric-value" id="metric-latency">0 ms</span>
                    </div>
                    <div class="metric-row">
                        <span>Prompt Tokens</span>
                        <span class="metric-value" id="metric-prompt-tokens">0</span>
                    </div>
                    <div class="metric-row">
                        <span>Completion Tokens</span>
                        <span class="metric-value" id="metric-comp-tokens">0</span>
                    </div>
                    <div class="metric-row">
                        <span>Total Session Tokens</span>
                        <span class="metric-value" id="metric-total-tokens">0</span>
                    </div>
                    <div class="metric-row">
                        <span>Est. Cost (Llama 3.1)</span>
                        <span class="metric-value" style="color: #4caf50;" id="metric-cost">$0.0000</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-container">
            <header class="chat-header">
                <div class="header-info" style="display: flex; align-items: center; gap: 16px;">
                    <button id="btn-toggle-sidebar" class="toggle-sidebar-btn" title="Toggle Sidebar">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="9" y1="3" x2="9" y2="21"></line>
                        </svg>
                    </button>
                    <h2>LEO-AI</h2>
                </div>
                <div class="status-badge">
                    <span style="width: 8px; height: 8px; background: #4caf50; border-radius: 50%; display: inline-block;"></span>
                    Uvicorn: Active
                </div>
            </header>

            <div class="chat-feed" id="chat-feed">
                <div class="message-bubble assistant">
                    <span class="message-sender">LEO</span>
                    <div class="message-content">Welcome! I’m LEO, your AI assistant. How can I help you today?</div>
                </div>
            </div>

            <!-- Typing indicator -->
            <div class="typing-indicator" id="typing-indicator">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>

            <!-- Input area -->
            <div class="chat-input-area">
                <div class="input-wrapper">
                    <input type="text" id="chat-input" class="chat-input" placeholder="Enter your prompt here..." autocomplete="off">
                    <button class="btn" style="padding: 10px 20px;" id="btn-send">Send</button>
                </div>
            </div>
        </main>
    </div>

    <!-- Frontend Core Script -->
    <script>
        const chatFeed = document.getElementById('chat-feed');
        const chatInput = document.getElementById('chat-input');
        const btnSend = document.getElementById('btn-send');
        const btnResetSession = document.getElementById('btn-reset-session');
        const sessionIdInput = document.getElementById('session-id-input');
        const systemPromptInput = document.getElementById('system-prompt-input');
        const typingIndicator = document.getElementById('typing-indicator');
        const knowledgeInput = document.getElementById('knowledge-input');
        const btnSaveKnowledge = document.getElementById('btn-save-knowledge');

        // Metrics elements
        const metricLatency = document.getElementById('metric-latency');
        const metricPromptTokens = document.getElementById('metric-prompt-tokens');
        const metricCompTokens = document.getElementById('metric-comp-tokens');
        const metricTotalTokens = document.getElementById('metric-total-tokens');
        const metricCost = document.getElementById('metric-cost');

        let activeSessionId = "";
        let accumulatedTotalTokens = 0;

        // Pricing values (assumes approx. Llama 3.1 8B pricing on typical APIs: e.g. $0.05/1M Input, $0.08/1M Output)
        const COST_PER_INPUT_TOKEN = 0.05 / 1000000;
        const COST_PER_OUTPUT_TOKEN = 0.08 / 1000000;

        // Auto-focus input
        chatInput.focus();

        // Toggle sidebar listener
        const btnToggleSidebar = document.getElementById('btn-toggle-sidebar');
        const sidebar = document.querySelector('.sidebar');
        btnToggleSidebar.addEventListener('click', () => {
            sidebar.classList.toggle('collapsed');
        });

        // Listeners
        btnSend.addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
        btnResetSession.addEventListener('click', resetSession);
        btnSaveKnowledge.addEventListener('click', saveKnowledge);

        async function saveKnowledge() {
            if (!activeSessionId) {
                activeSessionId = crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).substring(2, 15);
                sessionIdInput.value = activeSessionId;
            }
            
            const content = knowledgeInput.value;
            try {
                const response = await fetch('/api/knowledge', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        session_id: activeSessionId,
                        content: content
                    })
                });
                
                if (!response.ok) throw new Error("Failed to save knowledge context.");
                
                alert("Knowledge context updated successfully! The engine will now use this document for RAG search.");
            } catch (error) {
                alert(`Error saving knowledge context: ${error.message}`);
            }
        }

        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;

            // Clear input box
            chatInput.value = '';

            // Add user message to UI
            appendMessage('user', text);

            // Show typing indicator
            typingIndicator.style.display = 'flex';
            chatFeed.scrollTop = chatFeed.scrollHeight;

            const startTime = performance.now();

            try {
                // Post payload
                const payload = {
                    message: text,
                    session_id: activeSessionId,
                    system_prompt: systemPromptInput.value.trim() || null
                };

                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errData = await response.json();
                    let errMsg = "Server error";
                    if (errData && errData.detail) {
                        if (typeof errData.detail === 'string') {
                            errMsg = errData.detail;
                        } else if (Array.isArray(errData.detail)) {
                            errMsg = errData.detail.map(err => `${err.loc.join('.')}: ${err.msg}`).join(', ');
                        } else if (typeof errData.detail === 'object') {
                            errMsg = JSON.stringify(errData.detail);
                        }
                    }
                    throw new Error(errMsg);
                }

                const data = await response.json();
                
                // Update session state
                if (!activeSessionId) {
                    activeSessionId = data.session_id;
                    sessionIdInput.value = activeSessionId;
                }

                const endTime = performance.now();
                const latency = Math.round(endTime - startTime);

                // Hide typing
                typingIndicator.style.display = 'none';

                // Render assistant message
                appendMessage('assistant', data.response, data.usage);

                // Update analytics dashboard
                updateTelemetry(latency, data.usage);

            } catch (error) {
                typingIndicator.style.display = 'none';
                appendMessage('assistant', `⚠️ System Error: ${error.message}`);
                console.error("Chat Error:", error);
            }
        }

        function appendMessage(role, content, usage = null) {
            const bubble = document.createElement('div');
            bubble.classList.add('message-bubble', role);

            const senderLabel = document.createElement('span');
            senderLabel.classList.add('message-sender');
            senderLabel.textContent = role === 'user' ? 'User Agent' : 'Llama Engine';

            const contentDiv = document.createElement('div');
            contentDiv.classList.add('message-content');
            contentDiv.textContent = content;

            bubble.appendChild(senderLabel);
            bubble.appendChild(contentDiv);

            if (usage) {
                const chip = document.createElement('span');
                chip.classList.add('telemetry-chip');
                chip.textContent = `Prompt tkn: ${usage.prompt_tokens} | Comp tkn: ${usage.completion_tokens}`;
                bubble.appendChild(chip);
            }

            chatFeed.appendChild(bubble);
            chatFeed.scrollTop = chatFeed.scrollHeight;
        }

        function updateTelemetry(latency, usage) {
            metricLatency.textContent = `${latency} ms`;
            metricPromptTokens.textContent = usage.prompt_tokens;
            metricCompTokens.textContent = usage.completion_tokens;
            
            accumulatedTotalTokens += usage.total_tokens;
            metricTotalTokens.textContent = accumulatedTotalTokens;

            // Calculate cost approximation
            const cost = (usage.prompt_tokens * COST_PER_INPUT_TOKEN) + (usage.completion_tokens * COST_PER_OUTPUT_TOKEN);
            const currentTotalCost = parseFloat(metricCost.getAttribute('data-cost') || 0) + cost;
            
            metricCost.setAttribute('data-cost', currentTotalCost);
            metricCost.textContent = `$${currentTotalCost.toFixed(6)}`;
        }

        async function resetSession() {
            if (!activeSessionId) {
                alert("No active session to reset.");
                return;
            }

            if (confirm("Resetting session will clear all persistent historical state from the database. Proceed?")) {
                try {
                    const response = await fetch(`/api/session/clear?session_id=${activeSessionId}`, {
                        method: 'POST'
                    });

                    if (!response.ok) throw new Error("Failed to clear session DB records.");

                    // UI Reset
                    activeSessionId = "";
                    sessionIdInput.value = "";
                    knowledgeInput.value = "";
                    accumulatedTotalTokens = 0;
                    
                    metricLatency.textContent = "0 ms";
                    metricPromptTokens.textContent = "0";
                    metricCompTokens.textContent = "0";
                    metricTotalTokens.textContent = "0";
                    metricCost.setAttribute('data-cost', 0);
                    metricCost.textContent = "$0.0000";

                    // Clear messages (except original greeting)
                    const greetings = chatFeed.children[0];
                    chatFeed.innerHTML = "";
                    chatFeed.appendChild(greetings);

                    alert("Session state wiped successfully.");
                } catch (error) {
                    alert(`Error: ${error.message}`);
                }
            }
        }
    </script>
</body>
</html>
